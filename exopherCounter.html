<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Image Centering</title>
    <link rel="stylesheet" href="counter.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>


    <script type="module" src="./ExopherCount.js"></script>

<script type="py" src="main.py" config='{"packages": ["pillow", "opencv-python", "scikit-image", "pandas", "scipy"]}'></script>

<body>

    <!-- Parent container locked to 100% of the viewport -->
    <div class="app-parent">

        <!-- Top Section: 80% height for the Image Display -->
<!-- Top Section: 80% height for the Image Display -->
        <div class="top-section">
            <div id="upload-prompt">
                <h2>Upload Images</h2>
                
                <!-- NEW: Loading text -->
                <p id="python-status" style="color: #ffaa00; font-weight: bold;">⏳ Loading Python Environment... Please wait.</p>
                
                <!-- CHANGED: Added 'disabled' attribute to the end -->
                <input type="file" id="file-input" accept="image/*" multiple autocomplete="off" disabled>
            </div>
            
            <!-- Hidden by default until files are uploaded -->
            <img id="display-image" class="hidden" alt="Current Image">
            
            <!-- NEW: Result display element -->
        </div>

        <!-- Bottom Section: 20% height for Controls & Dropdown -->
        <div id="controls" class="bottom-section hidden">
    <!-- Previous Button (Unchanged) -->
            <button id="prev-btn">&#x21A9;</button>
            
            <!-- New Triangular Middle Layout -->
            <div class="middle-controls">
                
                <!-- Top Center: Dropdown -->
                <div class="control-top">
                    <select id="index-dropdown"></select>
                </div>
                
                <!-- Bottom Left: Stats -->
                <div class="control-left">
                    <h1 id="prediction-display">Count: 0</h1>
                    <span id="percentage-display"></span>
                </div>
                
                <!-- Bottom Right: Actions -->
                <div class="control-right">
                    <button id="present-btn" class="action-btn">True</button>
                    <button id="missing-btn" class="action-btn">False</button>
                    <button id="remove-btn" class="action-btn">Remove</button>
                </div>

            </div>

            <button id="next-btn">&#x21AA;</button>
        
        </div>

    </div>

</body>
</html>
